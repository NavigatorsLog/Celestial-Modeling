# b0.yml  v5 [CL, 5 October 2026]
# v5: also keeps collision_log.csv (formation_run v2), which v4 left out of the saved files.
# v4: resume download goes to the repository root, because the artifact keeps the run/ and build/ folders;
#     v3 put it in run/run/, so session 2 silently restarted from the beginning.
# Exploratory benchmark B0: one real-size run and one 3x run from the same B0 seed, one 6-hour session each.
# B0 is exploratory: it sets the cost estimate and the P-D12 matched-stage fraction. Its seed is never reused in P-D12.
# v3: runner hardware is recorded after any resume download, appended per session.
# v2: runs setup.sh through bash (files added in the web editor are not executable); adds explicit permissions.
name: B0 benchmark (exploratory)
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "B0 seed (never reused in P-D12)"
        default: "900001"
      tmax_yr:
        description: "Simulated-time cap in years"
        default: "300000000"
      resume_run_id:
        description: "Optional: run ID of an earlier B0 run to continue from"
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  b0:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        factor: ["1", "3"]
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned toolchain
        run: bash scripts/setup.sh
      - name: Fetch previous session (optional)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: b0-f${{ matrix.factor }}
          path: .
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record runner hardware (appended per session)
        run: |
          mkdir -p run
          { echo "session started $(date -u +%FT%TZ)"; nproc; lscpu | grep "Model name"; } >> run/runner.txt
      - name: Run one session (stops itself at 5.5 hours and saves)
        working-directory: run
        run: ../build/formation_run ${{ inputs.seed }} ${{ matrix.factor }} ${{ inputs.tmax_yr }} 19800 > session.log 2>&1 || true
      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: b0-f${{ matrix.factor }}
          path: |
            run/run.bin
            run/state.txt
            run/progress.csv
            run/collision_report.txt
            run/collision_log.csv
            run/done.txt
            run/runner.txt
            build/build_hashes.txt
          retention-days: 90
