# pd12.yml  v3 [CL, 6 October 2026]  (harness only; the frozen instrument is unchanged)
# v3: the chain pulls before pushing; in v1 and v2 the push was rejected whenever main had moved during the round,
#     and the error was swallowed, so round 1's progress never reached results/pd12/ (the saved files were intact).
# v2: (1) runner image pinned to ubuntu-24.04, so the compiler cannot change mid-test when ubuntu-latest moves to
#     Ubuntu 26 on 19 October 2026; (2) a run whose previous session left no saved files (runner lost, or never
#     acquired) starts again from its seed instead of failing, which is safe because runs are deterministic;
#     (3) the chain counts unfinished runs from the config's run list, not from the saved files that happen to exist,
#     so a lost run can no longer drop out of the test unnoticed.
# Confirmatory comparison P-D12. Each round runs one 5.5-hour session of every unfinished run, publishes the text
# outputs to results/pd12/, and, if any run has not reached the matched stage, starts the next round by itself.
# Guard: refuses to run unless analysis/pd12_config.json says certified: true (commit-before-run discipline).
name: P-D12 comparison (confirmatory)
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Run ID of the previous round (empty for the first round)"
        default: ""
permissions:
  contents: write
  actions: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      measure: ${{ steps.m.outputs.measure }}
      fraction: ${{ steps.m.outputs.fraction }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - << 'PY'
          import json, os
          c = json.load(open('analysis/pd12_config.json'))
          if not c.get('certified'):
              raise SystemExit('P-D12 is not certified: refusing to run (see the preregistration).')
          inc = [dict(id=r['id'], seed=r['seed'], factor=r['factor']) for r in c['runs']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': inc}) + '\n')
              f.write('measure=' + c['stage_measure'] + '\n')
              f.write('fraction=' + str(c['stage_fraction']) + '\n')
          PY
  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this run's previous session
        if: ${{ inputs.resume_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pd12-${{ matrix.id }}
          path: run
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned toolchain (skipped if this run is already done)
        run: |
          mkdir -p run
          if [ ! -f run/done.txt ]; then bash scripts/setup.sh; fi
      - name: Run one session
        working-directory: run
        run: |
          { echo "session started $(date -u +%FT%TZ)"; nproc; lscpu | grep "Model name"; } >> runner.txt
          if [ ! -f done.txt ]; then
            ../build/formation_run ${{ matrix.seed }} ${{ matrix.factor }} 300000000 19800 ${{ needs.plan.outputs.measure }} ${{ needs.plan.outputs.fraction }} > session.log 2>&1 || true
            cp ../build/build_hashes.txt . || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pd12-${{ matrix.id }}
          path: run/
          retention-days: 90
  chain:
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: pd12-*
      - name: Publish text outputs and start the next round if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          left=0; lost=""
          for id in $(python3 -c "import json;print(' '.join(r['id'] for r in json.load(open('analysis/pd12_config.json'))['runs']))"); do
            d="dl/pd12-$id"
            if [ -d "$d" ]; then
              mkdir -p "results/pd12/$id"
              find "$d" -maxdepth 1 -type f \( -name '*.csv' -o -name '*.txt' \) -exec cp {} "results/pd12/$id/" \;
            else
              lost="$lost $id"
            fi
            [ -f "$d/done.txt" ] || left=$((left+1))
          done
          echo "no saved files this round (will restart from seed):$lost" > results/pd12/LOST.txt
          echo "round ${{ github.run_id }}: $left runs not yet at the matched stage" > results/pd12/ROUND.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add results/pd12 && git commit -m "P-D12 round ${{ github.run_id }}: $left runs remaining" || true
          for k in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
          if [ "$left" -gt 0 ]; then
            gh workflow run pd12.yml -f resume_run_id=${{ github.run_id }}
          fi
